<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anomi | Projects</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/project.css">
</head>
<body>

<header>
    <nav>
        <a href="home.html">Home</a>
        <a href="#">Projects</a>
        <a href="#">Contact</a>
    </nav>
</header>

<section class="projects-hero">
    <h1>My Projects</h1>
    <p>Explore a selection of my work, from creative concepts to functional web designs.</p>
</section>

<div class="decorative-divider"></div>

<section class="filter">
    <button class="filter-btn active" data-category="all">All</button>
    <button class="filter-btn" data-category="web">Web Design</button>
    <button class="filter-btn" data-category="graphic">Graphic Design</button>
    <button class="filter-btn" data-category="dynamic">Dynamic Media</button>

<section class="projects-grid">
    <div class="project-card" data-category="web">
        <img src="images/css_zengarden/web1.png" alt="Web Design Project">
        <h3>Zen Garden Redesign</h3>
    </div>

    <div class="project-card" data-category="dynamic">
        <img src="images/dynamic_poster/Memento.svg" alt="Dynamic Poster">
        <h3>Memento Poster</h3>
    </div>

    <div class="project-card" data-category="dynamic">
        <img src="images/dynamic_typography/timeline.png" alt="Dynamic Typography">
        <h3>Timeline Typography</h3>
    </div>

    <div class="project-card" data-category="graphic">
        <img src="images/graphic_logo/logo.png" alt="Logo Design">
        <h3>Logo Design</h3>
    </div>

    <div class="project-card" data-category="web">
        <img src="images/uselessweb/candle.png" alt="Website Concept">
        <h3>Website Concept</h3>
    </div>

<footer>
    &copy; 2025 Anomi. Crafted with creativity and passion.
</footer>
