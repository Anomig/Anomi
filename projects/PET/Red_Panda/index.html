<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Red Panda – Pure CSS Animation</title>
  <style>
    :root{
      --bg:#0e1726;
      --ground:#0a1220;
      --fur:#c55a2f;        /* main red panda fur */
      --fur-dark:#7a3a24;   /* darker accents */
      --fur-darker:#52281a; /* outline/shadow */
      --cream:#f4f0e6;      /* white/cream markings */
      --ear:#fff7ef;        /* ear inner */
      --nose:#2a1c17;
      --eye:#1a1010;
      --shine:#ffffff;
      --shadow:rgba(0,0,0,.25);
      --size: 320px;        /* overall scale */
      --speed: 6s;          /* base animation speed */
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100svh;
      display:grid;
      place-items:center;
      background:
        radial-gradient(circle at 70% 20%, #17243c 0 25%, transparent 26%),
        linear-gradient(#0c1628, #0a1322 45%, #0a1322 60%, #060a14 100%);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
    }

    .scene{ position:relative; width: min(90vmin, var(--size)); aspect-ratio: 1.3/1; }

    .ground{
      position:absolute; inset:auto 0 0 0; height:40%;
      background: radial-gradient(100% 60% at 50% 0%, rgba(255,255,255,.06), transparent 60%), var(--ground);
      border-radius: 60% 60% 0 0 / 40% 40% 0 0;
      overflow:hidden;
    }

    /* floating fireflies for ambience */
    .scene::before,
    .scene::after{
      content:""; position:absolute; inset:0; pointer-events:none;
      background:
        radial-gradient(4px 4px at 20% 30%, #e8ffe1AA 0 40%, transparent 45%),
        radial-gradient(3px 3px at 40% 15%, #e8ffe1AA 0 40%, transparent 45%),
        radial-gradient(3px 3px at 70% 28%, #e8ffe1AA 0 40%, transparent 45%),
        radial-gradient(4px 4px at 85% 10%, #e8ffe1AA 0 40%, transparent 45%),
        radial-gradient(3px 3px at 10% 8%,  #e8ffe1AA 0 40%, transparent 45%);
      filter: drop-shadow(0 0 6px #c0ffd4);
      animation: drift var(--speed) linear infinite;
    }
    .scene::after{ animation-duration: calc(var(--speed) * 1.6); opacity:.7 }
    @keyframes drift{ to{ transform: translateY(-6%)} }

    .panda{
      position:absolute; left:50%; bottom:16%; transform: translateX(-50%);
      width: 76%; height: 84%;
    }

    .shadow{
      position:absolute; left:50%; bottom:6%; transform: translateX(-50%);
      width:60%; height:10%; border-radius:50%;
      background: radial-gradient(closest-side, rgba(0,0,0,.35), transparent 70%);
      filter: blur(4px); opacity:.8; z-index:0;
      animation: breathe 4.4s ease-in-out infinite;
    }

    /* BODY */
    .body{
      position:absolute; bottom:12%; left: 15%; transform: translateX(-50%);
      width: 58%; height: 46%; z-index:1;
      background: radial-gradient(120% 100% at 50% 0%, var(--fur) 0 60%, var(--fur-dark) 61% 100%);
      border-radius: 55% 55% 45% 45% / 70% 70% 30% 30%;
      box-shadow: inset 0 -8px 0 0 var(--fur-dark), 0 6px 0 -2px var(--fur-darker);
      animation: breathe 4.4s ease-in-out infinite;
    }
    .belly{
      position:absolute; inset:26% 20% auto 20%; height:52%;
      background: radial-gradient(80% 80% at 50% 35%, #f0e6d8 0 45%, #e3d3bf 46% 70%, transparent 71%);
      border-radius:50% 50% 60% 60% / 60% 60% 40% 40%; opacity:.85;
    }
    .leg{ position:absolute; bottom:-6%; width:28%; height:32%; background: var(--fur-dark); z-index:-1;
          border-radius: 50% 50% 30% 30% / 55% 55% 35% 35%;
          box-shadow: inset 0 -6px 0 0 var(--fur-darker); }
    .leg.left{ left:10% }
    .leg.right{ right:10% }

    /* TAIL */
    .tail{
      position:absolute; right: -4%; bottom: 28%; width: 46%; height: 22%; z-index:0;
      transform-origin: 8% 62%;
      background: repeating-linear-gradient( 45deg,
        var(--fur) 0 16px,
        #e1b08a 16px 28px,
        var(--fur-dark) 28px 44px,
        #e1b08a 44px 56px );
      border-radius: 50% 60% 60% 50% / 70% 80% 40% 50%;
      box-shadow: inset -8px -4px 0 0 rgba(0,0,0,.1), 0 6px 0 -2px var(--fur-darker);
      animation: wag calc(var(--speed) * .65) ease-in-out infinite;
    }
    @keyframes wag{
      0%,100%{ transform: rotate(-14deg) translateY(0) }
      50%     { transform: rotate(18deg) translateY(-1px) }
    }

    /* HEAD */
    .head{
      position:absolute; left:22%; bottom: 46%; width: 46%; height: 46%; z-index:2;
      transform-origin: 60% 90%;
      animation: headBob calc(var(--speed) * 1.2) ease-in-out infinite;
    }
    @keyframes headBob{
      0%,100%{ transform: rotate(-1.2deg) translateY(0) }
      50%{      transform: rotate( 1.2deg) translateY(1px) }
    }

    .face{ position:absolute; inset:0; }
    .face::before{ /* main face */
      content:""; position:absolute; inset: 10% 6% 8% 6%; z-index:1;
      background: radial-gradient(130% 100% at 50% 20%, var(--fur) 0 60%, var(--fur-dark) 61% 100%);
      border-radius: 50% 50% 46% 46% / 58% 58% 42% 42%;
      box-shadow: inset 0 -8px 0 0 var(--fur-darker);
    }

    /* ears */
    .ear{ position:absolute; width: 36%; height:36%; top:-6%; background: var(--fur);
          border-radius: 60% 60% 40% 40% / 70% 70% 30% 30%;
          box-shadow: inset 0 -6px 0 0 var(--fur-dark), 0 3px 0 -1px var(--fur-darker);
          transform-origin: 50% 100%;
          animation: twitch calc(var(--speed) * 1.6) ease-in-out infinite;
    }
    .ear.left{ left:-2%; transform: rotate(-6deg) }
    .ear.right{ right:-2%; transform: rotate(6deg) }
    .ear::after{ content:""; position:absolute; inset:20% 18% 28% 18%; background: var(--ear);
                 border-radius: 60% 60% 40% 40% / 70% 70% 30% 30%; }
    @keyframes twitch{
      0%,100%{ transform: rotate(0deg) }
      85%{ transform: rotate(0deg) }
      92%{ transform: rotate(-7deg) }
      96%{ transform: rotate(6deg) }
    }

    /* white cheek/eyebrow mask typical of red pandas */
    .mask{
      position:absolute; inset: 28% 8% 18% 8%; z-index:2;
      background:
        radial-gradient(60% 70% at 24% 52%, var(--cream) 0 64%, transparent 66%),
        radial-gradient(60% 70% at 76% 52%, var(--cream) 0 64%, transparent 66%),
        radial-gradient(40% 30% at 50% 18%, var(--cream) 0 92%, transparent 94%);
    }

    /* eyes */
    .eye{ position:absolute; top:46%; width:18%; height:18%; background: var(--cream);
          border-radius:50%; z-index:3; overflow:hidden;
          box-shadow: inset 0 -3px 0 0 #e2d7c8;
          animation: blink 5.6s ease-in-out infinite;
    }
    .eye.left{ left:26%; }
    .eye.right{ right:26%; animation-delay: .18s }

    .pupil{
      position:absolute; inset:22% 22%; background: var(--eye); border-radius:50%;
    }
    .pupil::after{ content:""; position:absolute; width:28%; height:28%; left:18%; top:18%;
                    background: var(--shine); border-radius:50%; filter: blur(.3px); opacity:.9 }
    @keyframes blink{
      0%, 92%, 100% { clip-path: inset(0 0 0 0 round 50%); }
      94% { clip-path: inset(46% 0 44% 0 round 50%); }
      96% { clip-path: inset(0 0 0 0 round 50%); }
    }

    /* muzzle + nose */
    .nose{
      position:absolute; left:50%; top:64%; transform:translateX(-50%);
      width: 12%; height: 9%; background: var(--nose); border-radius: 50% 50% 70% 70% / 40% 40% 60% 60%;
      z-index:4;
    }
    .mouth{
      position:absolute; left:50%; top:74%; transform: translateX(-50%);
      width: 28%; height: 20%; z-index:3;
      background:
        radial-gradient(32% 46% at 30% 10%, var(--cream) 0 98%, transparent 100%),
        radial-gradient(32% 46% at 70% 10%, var(--cream) 0 98%, transparent 100%);
    }
    .mouth::after{
      content:""; position:absolute; left:50%; top:6%; transform: translateX(-50%);
      width: 32%; height: 60%; border: 3px solid var(--nose);
      border-top: none; border-left: none; border-right: none; border-radius: 0 0 60% 60% / 0 0 70% 70%;
    }

    /* whiskers */
    .whiskers{ position:absolute; top:64%; width:36%; height:2px; background: linear-gradient(90deg, transparent, #0004, transparent); z-index:3; }
    .whiskers.left{ left:-6%; transform: rotate(4deg); }
    .whiskers.right{ right:-6%; transform: rotate(-4deg); }
    .whiskers::before,
    .whiskers::after{
      content:""; position:absolute; left:0; right:0; height:2px; background: linear-gradient(90deg, transparent, #0003, transparent);
    }
    .whiskers::before{ top:-6px }
    .whiskers::after{ top:6px }

    /* subtle floating of the whole panda */
    .panda{ animation: floaty calc(var(--speed)*2) ease-in-out infinite; }
    @keyframes floaty{ 0%,100%{ transform: translateX(-50%) translateY(0) } 50%{ transform: translateX(-50%) translateY(-2px) } }

    @keyframes breathe{ 0%,100%{ transform: scaleY(1) } 50%{ transform: scaleY(1.02) } }

    /* responsive helper */
    @media (max-width: 520px){ :root{ --size: 280px } }
  </style>
</head>
<body>
  <div class="scene">
    <div class="ground"></div>

    <div class="panda">
      <div class="shadow"></div>

      <div class="body">
        <div class="belly"></div>
        <div class="leg left"></div>
        <div class="leg right"></div>
      </div>

      <div class="tail" aria-hidden="true"></div>

      <div class="head" role="img" aria-label="Animated red panda relaxing and wagging its tail">
        <div class="ear left"></div>
        <div class="ear right"></div>
        <div class="face">
          <div class="mask"></div>
          <div class="eye left"><span class="pupil"></span></div>
          <div class="eye right"><span class="pupil"></span></div>
          <div class="nose"></div>
          <div class="mouth"></div>
          <div class="whiskers left"></div>
          <div class="whiskers right"></div>
        </div>
      </div>

    </div>
  </div>
</body>
</html>
