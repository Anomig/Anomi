<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alien - Dynamic Poster</title>
    <link rel="icon" type="image/png" href="/images/Anomi-favicon.png">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden; /* Zorgt ervoor dat er geen ongewenst scrollen is */
            font-family: 'Arial', sans-serif;
        }

        .poster {
            position: relative;
            width: 600px;
            height: 900px;
            background: url('alien-background.jpg') no-repeat center center;
            background-size: cover;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            border: 5px solid #333; /* Toegevoegd om de poster meer te laten opvallen */
        }

        .egg-container {
            position: absolute;
            top: 20%;
            width: 100%;
            height: 70%;
            pointer-events: none;
        }

        .egg {
            width: 80px;
            height: 120px;
            border-radius: 50%;
            position: absolute;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.7);
            opacity: 0.8;
            animation: glow 8s ease-in-out infinite;
        }

        .egg:nth-child(1) {
            top: 0%;
            left: 10%;
            animation-delay: 0s;
        }

        .egg:nth-child(2) {
            top: 25%;
            left: 30%;
            animation-delay: 2s;
        }

        .egg:nth-child(3) {
            top: -10%;
            left: 50%;
            animation-delay: 4s;
        }

        .egg:nth-child(4) {
            top: 45%;
            left: 70%;
            animation-delay: 6s;
        }

        .egg:nth-child(5) {
            top: 60%;
            left: 40%;
            animation-delay: 8s;
        }

        @keyframes glow {
            0% {
                box-shadow: 0 0 10px rgba(0, 255, 0, 0.7);
                opacity: 0;
            }
            50% {
                box-shadow: 0 0 30px rgba(0, 255, 0, 1);
                opacity: 1;
            }
            100% {
                box-shadow: 0 0 10px rgba(0, 255, 0, 0.7);
                opacity: 0.5;
            }
        }

        .poster .content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }

        .poster h1 {
            margin: 20px 0;
            font-size: 3em;
            text-shadow: 3px 3px 10px rgba(0, 0, 0, 0.7);
            letter-spacing: 2px;
        }

        .poster h2 {
            margin: 0;
            font-size: 1.8em;
            text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.7);
        }

        .poster .info {
            margin-top: 10px;
            font-size: 1em;
        }

        .poster .quote {
            margin-top: 20px;
            font-style: italic;
            font-size: 1.2em;
            text-align: center;
            border-top: 2px solid #fff;
            padding-top: 10px;
        }

        footer {
            position: absolute;
            bottom: 10px;
            width: 100%;
            text-align: center;
            font-size: 0.8em;
            color: #ddd;
        }
    </style>
</head>
<body>
    <div class="poster">
        <div class="egg-container">
            <div class="egg"></div>
            <div class="egg"></div>
            <div class="egg"></div>
            <div class="egg"></div>
            <div class="egg"></div>
        </div>
        <div class="content">
            <h1>Alien</h1>
            <h2>Directed by Ridley Scott</h2>
            <div class="info">
                <p>Sigourney Weaver, Tom Skerritt, John Hurt</p>
            </div>
            <div class="quote">
                <p>"This is Ripley, last survivor of the Nostromo, signing off."</p>
            </div>
        </div>
        <footer>
            <p>© 1979 20th Century Fox. All Rights Reserved.</p>
        </footer>
    </div>
</body>
</html>
