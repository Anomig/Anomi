<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anomi | Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/home.css">
</head>
<body>
    <!-- header////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////// -->
    <header>
        <!-- <div class="logo">Anomi</div> -->
        <nav>
            <a href="#">About</a>
            <a href="#">Projects</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <section class="hero">
        <h1>Hi, I'm 
            <span class="name">
                <span class="letter n">n</span>
                <span class="letter a">a</span>
                omi!
            </span>
        </h1>
        <p>As a "Digital Experience Design" student, I combine creativity and technology to make stong digital solutions.</p>
    </section>
    <!-- header////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////// -->
    
    <div class="decorative-divider"></div>

    <!-- carousel////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////// -->
    <section class="carousel">
        <div class="carousel-track">
            <div class="carousel-slide" style="background-image: url('images/css_zengarden/web1.png');"></div>
            <div class="carousel-slide" style="background-image: url('images/dynamic_poster/Memento.svg');"></div>
            <div class="carousel-slide" style="background-image: url('images/dynamic_typography/timeline.png');"></div>
        </div>
        <div class="buttons">
            <button id="prev">&#10094;</button>
            <button id="next">&#10095;</button>
        </div>
    </section>
    <!-- carousel////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////// -->

    <footer>
        &copy; 2025 Anomi. Crafted with creativity and passion.
        <div class="social-links">
            <a href="https://www.linkedin.com/in/naomi-goyvaerts" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">LinkedIn</a>
            <a href="mailto:goyvaerts.naomi@hotmail.com?subject=Contact%20via%20Portfolio&body=Hallo%20Naomi,
            %0D%0AIk%20ben%20geïnteresseerd%20in%20je%20werk%20en%20wil%20graag%20meer%20weten.%0D%0AGroeten," 
            title="Stuur een e-mail naar Naomi">Email</a>
            <a href="https://github.com/Anomig" target="_blank" rel="noopener noreferrer" aria-label="GitHub">Github</a>
        </div>
    </footer>

    <script>
        const track = document.querySelector('.carousel-track');
        const slides = Array.from(track.children);
        const nextButton = document.getElementById('next');
        const prevButton = document.getElementById('prev');
        let slideIndex = 0;

        function updateCarousel() {
            const amountToMove = slides[0].getBoundingClientRect().width;
            track.style.transform = 'translateX(' + (-amountToMove * slideIndex) + 'px)';
        }

        nextButton.addEventListener('click', () => {
            slideIndex = (slideIndex + 1) % slides.length;
            updateCarousel();
        });

        prevButton.addEventListener('click', () => {
            slideIndex = (slideIndex - 1 + slides.length) % slides.length;
            updateCarousel();
        });

        setInterval(() => {
            slideIndex = (slideIndex + 1) % slides.length;
            updateCarousel();
        }, 5000);
    
        document.addEventListener('mousemove', function(e) {
            const x = e.clientX / window.innerWidth;
            const y = e.clientY / window.innerHeight;
        document.body.style.background = `radial-gradient(circle 150px at ${x * 100}% ${y * 100}%, #FCE7D2, #f9f2eb)`;
        });
    </script>

    
</body>
</html>
